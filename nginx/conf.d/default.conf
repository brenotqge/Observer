# GoNginx Observer — configuração do NGINX Open Source (sem módulos de terceiros).
#
# Este arquivo é incluído no contexto `http` do nginx.conf padrão da imagem oficial.

# ---------------------------------------------------------------------------
# Log estruturado em JSON Lines (uma requisição por linha).
#
# Privacidade: registramos apenas o necessário para as métricas.
#  - $observer_path é o caminho ORIGINAL pedido pelo cliente, sem a query
#    string (extraído de $request_uri pelo map abaixo). Usamos isso em vez de
#    $uri porque $uri muda após redirecionamentos internos (ex.: / → /index.html).
#  - Não registramos cookies, Authorization, User-Agent nem corpo da requisição.
# `escape=json` garante que valores com aspas/controles gerem JSON válido.
# ---------------------------------------------------------------------------
map $request_uri $observer_path {
    "~^(?<path>[^?]*)"  $path;
    default             "";
}

log_format observer_json escape=json
  '{"ts":$msec,'
  '"time":"$time_iso8601",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$observer_path",'
  '"status":$status,'
  '"bytes_sent":$bytes_sent,'
  '"request_time":$request_time}';

# ---------------------------------------------------------------------------
# IP real do cliente (ngx_http_realip_module, incluído na build oficial).
#
# Na demonstração, o gerador de tráfego envia IPs FICTÍCIOS (faixas de
# documentação TEST-NET, RFC 5737) no cabeçalho X-Forwarded-For. Só confiamos
# nesse cabeçalho quando a conexão vem de redes privadas/loopback (Docker).
# Em produção, restrinja set_real_ip_from ao endereço do seu balanceador.
# ---------------------------------------------------------------------------
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80 default_server;
    server_name _;

    # Log estruturado em um caminho próprio, dentro do volume compartilhado.
    # (O access.log padrão da imagem oficial é um symlink para stdout.)
    access_log /var/log/observer/access.jsonl observer_json;

    root /usr/share/nginx/html;
    index index.html;

    # 200 — página de demonstração
    location = / {
        try_files /index.html =404;
    }

    # 200 — "API" estática de demonstração
    location = /api/items {
        default_type application/json;
        return 200 '{"items":[{"id":1,"name":"alpha"},{"id":2,"name":"beta"}]}\n';
    }

    # 500 — erro de servidor proposital
    location = /error {
        return 500;
    }

    # 200 lento — 48 KiB limitados a 32 KiB/s. O NGINX libera a cota do
    # primeiro segundo de imediato, então a resposta leva ~1 s e
    # $request_time passa a ter valores observáveis sem módulos extras.
    location = /slow {
        alias /usr/share/nginx/demo/payload.bin;
        default_type application/octet-stream;
        limit_rate 32k;
    }

    # Healthcheck do container: fora das métricas.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Qualquer outro caminho inexistente → 404 (comportamento padrão).
}
